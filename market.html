<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Market Card — Valuation Hallucination</title>
  <meta name="description" content="A live market card for Valuation Hallucination." />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#07090b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/core-icon.png" />
  <style>
    :root { --ink:#07090b; --paper:#f8f5ee; --acid:#d9ff00; --pink:#ff1493; --violet:#6f30ff; --line:rgba(255,255,255,.2); }
    * { box-sizing:border-box; }
    html { color-scheme:dark; background:var(--ink); }
    body { margin:0; min-height:100svh; color:white; background:radial-gradient(circle at 50% 43%,rgba(111,48,255,.22),transparent 30rem),var(--ink); font-family:"Space Grotesk",system-ui,sans-serif; overflow-x:hidden; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.13; background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px); background-size:28px 28px; }
    button { font:inherit; }
    .mono { font-family:"DM Mono",monospace; text-transform:uppercase; letter-spacing:.08em; }
    .screen { width:min(100%,540px); min-height:100svh; margin:auto; padding:0 max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left)); display:grid; grid-template-rows:58px minmax(0,1fr) 52px; position:relative; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); }
    .logo { width:176px; height:auto; display:block; }
    .state { display:inline-flex; align-items:center; gap:7px; color:rgba(255,255,255,.6); font-size:.53rem; white-space:nowrap; }
    .state::before { content:""; width:7px; height:7px; background:var(--acid); box-shadow:0 0 11px var(--acid); }
    main { min-height:0; display:grid; place-items:center; padding:12px 0 10px; }
    .deck { width:100%; height:100%; min-height:0; display:grid; place-items:center; perspective:1000px; }
    .card { --accent:var(--acid); position:relative; height:min(100%,590px); width:auto; max-width:91vw; aspect-ratio:2.5/3.5; border:3px solid var(--ink); border-radius:20px; background:var(--paper); color:var(--ink); box-shadow:0 0 0 5px rgba(255,255,255,.07),12px 15px 0 rgba(0,0,0,.72),0 0 76px color-mix(in srgb,var(--accent) 24%,transparent); padding:clamp(17px,4.5vw,23px); display:flex; flex-direction:column; transition:transform .3s ease,opacity .2s ease; }
    .card.negative { --accent:var(--pink); }
    .card.conditional { --accent:var(--violet); }
    .card.loading { transform:rotateY(88deg) scale(.95); opacity:.2; }
    .card-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; font-size:clamp(.5rem,1.7vw,.64rem); }
    .badge { color:white; background:var(--accent); border:2px solid var(--ink); padding:7px 9px; }
    .card.positive .badge { color:var(--ink); }
    .signal { margin:auto 0 18px; color:var(--accent); -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; font-weight:700; font-size:clamp(3.1rem,15vw,5.8rem); line-height:.85; letter-spacing:-.08em; }
    .card-title { margin:0; font-size:clamp(1.75rem,7vw,2.25rem); line-height:.9; letter-spacing:-.06em; text-transform:uppercase; }
    .description { margin:13px 0; font-size:clamp(.76rem,2.7vw,.92rem); line-height:1.35; }
    .effect { margin-top:auto; padding-top:13px; border-top:3px solid var(--ink); font:500 clamp(.61rem,2.25vw,.75rem)/1.45 "DM Mono",monospace; text-transform:uppercase; }
    .stamp { position:absolute; right:-10px; top:45%; padding:7px 9px; color:white; background:var(--accent); border:2px solid var(--ink); transform:rotate(7deg); font-size:clamp(.48rem,1.8vw,.59rem); }
    .controls { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:9px; border-top:1px solid var(--line); }
    .home { min-height:38px; display:inline-flex; align-items:center; border:1px solid var(--line); padding:0 10px; color:rgba(255,255,255,.72); text-decoration:none; font:500 .57rem "DM Mono",monospace; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
    .home:hover,.home:focus-visible { color:var(--ink); background:white; border-color:white; outline:none; }
    .caption { color:rgba(255,255,255,.48); font-size:.52rem; line-height:1.35; overflow:hidden; }
    .caption a { display:block; max-width:100%; overflow:hidden; color:rgba(255,255,255,.72); text-overflow:ellipsis; white-space:nowrap; text-decoration:none; }
    .caption a:hover,.caption a:focus-visible { color:var(--acid); outline:none; }
    .draw { min-height:38px; border:1px solid var(--acid); padding:0 12px; cursor:pointer; background:transparent; color:var(--acid); font:500 .57rem "DM Mono",monospace; text-transform:uppercase; letter-spacing:.06em; }
    .draw:hover,.draw:focus-visible { color:var(--ink); background:var(--acid); outline:none; }
    .draw:disabled { opacity:.55; cursor:wait; }
    @media (max-height:660px) { .screen{grid-template-rows:50px minmax(0,1fr) 46px}.logo{width:150px}main{padding:7px 0}.card{border-radius:16px}.caption{font-size:.48rem}.home,.draw{min-height:34px;padding-inline:9px} }
    @media (min-width:760px) { .screen{padding-inline:22px}.card{transform:rotate(-.5deg)} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important} }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <img class="logo" src="/assets/logo-light.webp" width="520" height="201" alt="Valuation Hallucination" />
      <span class="state mono" id="marketState">Market active</span>
    </header>
    <main>
      <section class="deck" aria-live="polite" aria-busy="false">
        <article class="card positive" id="marketCard">
          <div class="card-top mono"><span class="badge" id="polarity">Positive event</span><span id="cardId">Market // 06</span></div>
          <div class="signal" id="signal">+$100M</div>
          <h1 class="card-title" id="title">Hype Train</h1>
          <p class="description" id="description">AI is on every front page and nobody is checking the unit economics.</p>
          <p class="effect" id="effect">Every player immediately gains $100M in valuation.</p>
          <span class="stamp mono" id="target">Every company</span>
        </article>
      </section>
    </main>
    <div class="controls">
      <a class="home" href="/" aria-label="Return to the Valuation Hallucination homepage">← Home</a>
      <span class="caption mono"><a id="sourceLink" href="#" target="_blank" rel="noreferrer">Loading market source…</a>Place phone face-up at the center of the table</span>
      <button class="draw" id="drawButton" type="button">Refresh ↻</button>
    </div>
  </div>
  <script>
    const card = document.getElementById('marketCard');
    const deck = document.querySelector('.deck');
    const drawButton = document.getElementById('drawButton');
    const fields = ['signal','title','description','effect','target'];

    function render(data, payload) {
      card.className = `card ${data.polarity}`;
      document.getElementById('polarity').textContent = payload.selection_method === 'slack_override' ? 'Human pick' : `${data.polarity} event`;
      const stamp = payload.generated_at ? new Date(payload.generated_at).toLocaleString([], { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }) : 'Current round';
      document.getElementById('cardId').textContent = stamp;
      fields.forEach((field) => { document.getElementById(field).textContent = data[field]; });
      document.getElementById('marketState').textContent = payload.selection_method === 'slack_override' ? 'Human override' : payload.selection_method === 'automatic' ? 'Live market signal' : 'Fallback card';
      const source = document.getElementById('sourceLink');
      source.textContent = data.source_name ? `${data.source_name} ↗` : 'Market source';
      source.href = data.source_url || '#';
      source.hidden = !data.source_url;
    }

    async function draw() {
      card.classList.add('loading');
      deck.setAttribute('aria-busy','true');
      drawButton.disabled = true;
      try {
        const response = await fetch('/api/market', { cache:'no-store' });
        if (!response.ok) throw new Error('Market feed unavailable');
        const result = await response.json();
        setTimeout(() => render(result.card, result), 150);
      } catch (error) {
        document.getElementById('description').textContent = 'The market feed glitched. Try drawing again.';
      } finally {
        setTimeout(() => {
          card.classList.remove('loading');
          deck.setAttribute('aria-busy','false');
          drawButton.disabled = false;
        }, 250);
      }
    }

    drawButton.addEventListener('click', draw);
    draw();
    window.setInterval(draw, 60_000);
  </script>
</body>
</html>
